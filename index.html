<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNCROZZ Assets</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI,Arial,sans-serif;
        }

        body{
            background:#f5f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            color:#1f2937;
        }

        .card{
            background:#fff;
            padding:50px;
            border-radius:18px;
            box-shadow:0 15px 35px rgba(0,0,0,.08);
            max-width:700px;
            text-align:center;
        }

        h1{
            font-size:42px;
            margin-bottom:10px;
        }

        p{
            font-size:18px;
            color:#6b7280;
            margin-bottom:30px;
        }

        .status{
            display:inline-block;
            padding:8px 16px;
            background:#16a34a;
            color:white;
            border-radius:999px;
            font-weight:600;
            margin-bottom:30px;
        }

        .grid{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:15px;
            text-align:left;
        }

        .item{
            background:#f9fafb;
            padding:14px;
            border-radius:10px;
        }

        footer{
            margin-top:40px;
            font-size:13px;
            color:#9ca3af;
        }
    </style>

</head>

<body>

<div class="card">

    <h1>SYNCROZZ Assets</h1>

    <p>
        Official Central Asset Repository for the SYNCROZZ Ecosystem
    </p>

    <div class="status">
        Version 1.0 • Stable
    </div>

    <div class="grid">

        <div class="item">🖼 Profile Images</div>
        <div class="item">🎨 Logos</div>
        <div class="item">📢 Banners</div>
        <div class="item">🪪 Badges</div>
        <div class="item">📄 Documents</div>
        <div class="item">⭐ Placeholders</div>

    </div>

    <footer>

        © SYNCROZZ

    </footer>

</div>

</body>
</html>
